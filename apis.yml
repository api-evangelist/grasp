aid: grasp
name: grasp
description: Grasp is a members-based, AI-powered learning platform based in London, England that builds
  personalized, AI-curated short courses. Learners discuss a goal with an AI mentor, which co-creates a
  syllabus and assembles a structured "learning path" from the clearest, most credible resources on the
  web - organized into focused, roughly hour-long lessons with clear outcomes and practice exercises.
  Grasp is delivered as a client-rendered React single-page app with a 14-day free trial and a single
  monthly membership; a selection of public courses and lessons is browsable without an account, and a
  sister product, Grasp Concepts, lives at concepts.grasp.study. Surfaced as a portfolio company of
  balderton-capital and point-nine.
